[project]
name = "crossborder-cost-router"
version = "0.2.0"
description = "Grounded multilingual AI support agent with hybrid RAG and risk-aware routing"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
ai = ["openai-agents>=0.23,<1"]
dev = ["coverage>=7.6,<8", "httpx2>=2.12,<3"]

[project.scripts]
cost-router = "core.cost_router:main"
cost-router-benchmark = "core.benchmark:main"
support-agent = "core.agent:main"
support-agent-eval = "core.agent_eval:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "config*", "knowledge*"]

[tool.setuptools.package-data]
config = ["*.json"]
knowledge = ["*.json"]
